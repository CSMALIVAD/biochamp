<!DOCTYPE html>
<html>

<head>

<title>BioChamp</title>

<style>

body{
margin:0;
background:black;
font-family:Arial;
overflow:hidden;
color:white;
}

#panel{
position:absolute;
top:20px;
left:20px;
z-index:10;
background:#111;
padding:20px;
border-radius:10px;
border:1px solid #333;
}

input{
display:block;
margin-top:10px;
padding:10px;
width:220px;
background:#222;
border:1px solid #444;
color:white;
}

button{
margin-top:12px;
padding:10px;
width:100%;
background:#00d4ff;
border:none;
font-weight:bold;
cursor:pointer;
}

svg{
width:100vw;
height:100vh;
cursor:grab;
}

.node{
fill:#00d4ff;
stroke:white;
stroke-width:2;
cursor:pointer;
}

.label{
fill:white;
font-size:18px;
text-anchor:middle;
pointer-events:none;
}

.arrow{
stroke:white;
stroke-width:4;
fill:none;
}

.enzyme{
fill:#00ff88;
font-size:20px;
text-anchor:middle;
}

</style>

</head>

<body>

<div id="panel">

<h2>BioChamp</h2>

<input id="mol1" placeholder="First Metabolite">

<input id="enzyme" placeholder="Enzyme">

<input id="mol2" placeholder="Second Metabolite">

<button onclick="createLinear()">
Create Linear
</button>

<button onclick="createCircular()">
Create Circular
</button>

<button onclick="saveData()">
Save
</button>

<button onclick="loadData()">
Load
</button>

</div>

<svg id="viewer">

<g id="canvas"></g>

</svg>

<script>

let svg=document.getElementById("viewer");
let canvas=document.getElementById("canvas");

let scale=1;
let panX=0;
let panY=0;

let isDraggingCanvas=false;

let startX,startY;

let pathways=[];

function updateTransform(){

canvas.setAttribute(
"transform",
`translate(${panX},${panY}) scale(${scale})`
);

}

svg.addEventListener("wheel",(e)=>{

e.preventDefault();

if(e.deltaY<0){
scale*=1.1;
}
else{
scale*=0.9;
}

updateTransform();

});

svg.addEventListener("mousedown",(e)=>{

if(e.target.classList.contains("node")) return;

isDraggingCanvas=true;

startX=e.clientX-panX;
startY=e.clientY-panY;

});

svg.addEventListener("mouseup",()=>{

isDraggingCanvas=false;

});

svg.addEventListener("mousemove",(e)=>{

if(!isDraggingCanvas) return;

panX=e.clientX-startX;
panY=e.clientY-startY;

updateTransform();

});

function createLinear(){

let mol1=document.getElementById("mol1").value;
let enzyme=document.getElementById("enzyme").value;
let mol2=document.getElementById("mol2").value;

pathways.push({
type:"linear",
mol1,
enzyme,
mol2,
x1:200,
y1:200+pathways.length*250,
x2:700,
y2:200+pathways.length*250
});

render();

}

function createCircular(){

let radius=250;
let centerX=900;
let centerY=500;

let nodes=[];

for(let i=0;i<8;i++){

let angle=(Math.PI*2/8)*i;

nodes.push({
x:centerX+Math.cos(angle)*radius,
y:centerY+Math.sin(angle)*radius,
name:"Node "+(i+1)
});

}

pathways.push({
type:"circular",
nodes:nodes
});

render();

}

function render(){

canvas.innerHTML="";

pathways.forEach((p,index)=>{

if(p.type==="linear"){

canvas.innerHTML+=`

<line
x1="${p.x1+80}"
y1="${p.y1}"
x2="${p.x2-80}"
y2="${p.y2}"
class="arrow"
/>

<polygon
points="
${p.x2-80},${p.y2}
${p.x2-110},${p.y2-15}
${p.x2-110},${p.y2+15}"
fill="white"
/>

<circle
cx="${p.x1}"
cy="${p.y1}"
r="70"
class="node"
onmousedown="dragNode(evt,this,${index},'x1','y1')"
/>

<text
x="${p.x1}"
y="${p.y1+5}"
class="label"
>
${p.mol1}
</text>

<circle
cx="${p.x2}"
cy="${p.y2}"
r="70"
fill="#ff9800"
stroke="white"
stroke-width="2"
class="node"
onmousedown="dragNode(evt,this,${index},'x2','y2')"
/>

<text
x="${p.x2}"
y="${p.y2+5}"
class="label"
>
${p.mol2}
</text>

<text
x="${(p.x1+p.x2)/2}"
y="${p.y1-60}"
class="enzyme"
>
${p.enzyme}
</text>

`;

}

if(p.type==="circular"){

for(let i=0;i<p.nodes.length;i++){

let n1=p.nodes[i];
let n2=p.nodes[(i+1)%p.nodes.length];

canvas.innerHTML+=`

<line
x1="${n1.x}"
y1="${n1.y}"
x2="${n2.x}"
y2="${n2.y}"
class="arrow"
/>

<circle
cx="${n1.x}"
cy="${n1.y}"
r="50"
class="node"
/>

<text
x="${n1.x}"
y="${n1.y+5}"
class="label"
>
${n1.name}
</text>

`;

}

}

});

updateTransform();

}

let dragInfo=null;

function dragNode(evt,element,index,xKey,yKey){

evt.stopPropagation();

dragInfo={
index,
xKey,
yKey
};

}

window.addEventListener("mousemove",(e)=>{

if(!dragInfo) return;

pathways[dragInfo.index][dragInfo.xKey]=
(e.clientX-panX)/scale;

pathways[dragInfo.index][dragInfo.yKey]=
(e.clientY-panY)/scale;

render();

});

window.addEventListener("mouseup",()=>{

dragInfo=null;

});

function saveData(){

localStorage.setItem(
"biochampData",
JSON.stringify(pathways)
);

alert("Saved");

}

function loadData(){

let data=localStorage.getItem("biochampData");

if(data){

pathways=JSON.parse(data);

render();

alert("Loaded");

}

}

updateTransform();

</script>

</body>
</html>
