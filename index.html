<!DOCTYPE html>
<html>

<head>

<title>BioChamp</title>

<link
rel="stylesheet"
href="css/style.css"
>

</head>

<body>

<!-- LEFT PANEL -->

<div id="panel">

<h2>BioChamp</h2>

<input
id="mol1"
placeholder="First Metabolite"
>

<input
id="enzyme"
placeholder="Enzyme"
>

<input
id="mol2"
placeholder="Second Metabolite"
>

<input
id="coIn"
placeholder="Cofactor Input"
>

<input
id="coOut"
placeholder="Cofactor Output"
>

<button id="linearBtn">
Create Linear
</button>

<button id="saveBtn">
Save
</button>

<button id="loadBtn">
Load
</button>

<button id="adminBtn">
Admin Login
</button>

</div>

<!-- ADMIN PANEL -->

<div id="adminBar">

<h3>Object Editor</h3>

<input
id="editLabel"
placeholder="Edit Label"
>

<input
id="editColor"
placeholder="Color"
>

<select id="editShape">

<option value="rect">
Rectangle
</option>

<option value="circle">
Circle
</option>

</select>

<button id="applyBtn">
Apply Changes
</button>

</div>

<!-- SVG -->

<svg id="viewer">

<defs>

<marker
id="arrowhead"
markerWidth="10"
markerHeight="7"
refX="10"
refY="3.5"
orient="auto"
>

<polygon
points="0 0, 10 3.5, 0 7"
fill="white"
/>

</marker>

</defs>

<g id="canvas"></g>

</svg>

<script
type="module"
src="js/app.js"
></script>

</body>
</html>
