<!DOCTYPE html>
<html>

<head>

<title>BioChamp</title>

<style>

body{
margin:0;
background:#000;
font-family:Arial;
overflow:hidden;
color:white;
}

h1{
position:absolute;
top:10px;
left:20px;
z-index:10;
color:#00d4ff;
}

#controls{
position:absolute;
top:70px;
left:20px;
z-index:10;
background:#111;
padding:15px;
border-radius:10px;
border:1px solid #333;
}

input{
display:block;
margin-top:10px;
padding:10px;
background:#222;
border:1px solid #444;
color:white;
width:220px;
}

button{
margin-top:12px;
padding:10px;
width:100%;
background:#00d4ff;
border:none;
font-weight:bold;
cursor:pointer;
}

svg{
width:100vw;
height:100vh;
background:black;
cursor:grab;
}

.node{
fill:#00d4ff;
stroke:white;
stroke-width:2;
}

.label{
fill:white;
font-size:18px;
text-anchor:middle;
pointer-events:none;
}

.arrow{
stroke:white;
stroke-width:4;
}

.enzyme{
fill:#00ff88;
font-size:22px;
text-anchor:middle;
}

</style>

</head>

<body>

<h1>BioChamp Pathway Viewer</h1>

<div id="controls">

<input id="mol1" placeholder="First Metabolite">

<input id="enzyme" placeholder="Enzyme">

<input id="mol2" placeholder="Second Metabolite">

<button onclick="createPathway()">
Create Pathway
</button>

</div>

<svg id="viewer">

<g id="canvas"></g>

</svg>

<script>

let svg=document.getElementById("viewer");
let canvas=document.getElementById("canvas");

let scale=1;
let panX=0;
let panY=0;

let isDragging=false;
let startX,startY;

function updateTransform(){

canvas.setAttribute(
"transform",
`translate(${panX},${panY}) scale(${scale})`
);

}

svg.addEventListener("wheel",(e)=>{

e.preventDefault();

if(e.deltaY<0){
scale*=1.1;
}
else{
scale*=0.9;
}

updateTransform();

});

svg.addEventListener("mousedown",(e)=>{

isDragging=true;

startX=e.clientX-panX;
startY=e.clientY-panY;

svg.style.cursor="grabbing";

});

svg.addEventListener("mouseup",()=>{

isDragging=false;
svg.style.cursor="grab";

});

svg.addEventListener("mousemove",(e)=>{

if(!isDragging) return;

panX=e.clientX-startX;
panY=e.clientY-startY;

updateTransform();

});

let pathwayDatabase=[];

function createPathway(){

let mol1=document.getElementById("mol1").value;
let enzyme=document.getElementById("enzyme").value;
let mol2=document.getElementById("mol2").value;

let pathway={
molecule1:mol1,
enzyme:enzyme,
molecule2:mol2
};

pathwayDatabase.push(pathway);

renderPathways();

}

function renderPathways(){

canvas.innerHTML="";

pathwayDatabase.forEach((p,index)=>{

let offsetY=index*250;

canvas.innerHTML += `

<line
x1="350"
y1="${350+offsetY}"
x2="800"
y2="${350+offsetY}"
class="arrow"
/>

<polygon
points="
800,${350+offsetY}
770,${335+offsetY}
770,${365+offsetY}"
fill="white"
/>

<circle
cx="250"
cy="${350+offsetY}"
r="70"
class="node"
/>

<text
x="250"
y="${355+offsetY}"
class="label"
>
${p.molecule1}
</text>

<circle
cx="920"
cy="${350+offsetY}"
r="70"
fill="#ff9800"
stroke="white"
stroke-width="2"
/>

<text
x="920"
y="${355+offsetY}"
class="label"
>
${p.molecule2}
</text>

<text
x="575"
y="${300+offsetY}"
class="enzyme"
>
${p.enzyme}
</text>

`;

});

}

updateTransform();

</script>

</body>
</html>
