<!DOCTYPE html>
<html>

<head>

<title>BioChamp</title>

<style>

body{
margin:0;
background:black;
font-family:Arial;
overflow:hidden;
color:white;
}

#panel{
position:absolute;
top:20px;
left:20px;
z-index:10;
background:#111;
padding:20px;
border-radius:10px;
border:1px solid #333;
}

input{
display:block;
margin-top:10px;
padding:10px;
width:220px;
background:#222;
border:1px solid #444;
color:white;
}

button{
margin-top:12px;
padding:10px;
width:100%;
background:#00d4ff;
border:none;
font-weight:bold;
cursor:pointer;
}

svg{
width:100vw;
height:100vh;
cursor:grab;
}

.node{
fill:#00d4ff;
stroke:white;
stroke-width:2;
cursor:pointer;
}

.label{
fill:white;
font-size:18px;
text-anchor:middle;
pointer-events:none;
}

.arrow{
stroke:white;
stroke-width:4;
fill:none;
}

.enzyme{
fill:#00ff88;
font-size:20px;
text-anchor:middle;
}

</style>

</head>

<body>

<div id="panel">

<h2>BioChamp</h2>

<input id="mol1" placeholder="First Metabolite">

<input id="enzyme" placeholder="Enzyme">

<input id="mol2" placeholder="Second Metabolite">

<button onclick="createLinear()">
Create Linear
</button>

<button onclick="createCircular()">
Create Circular
</button>

<button onclick="saveData()">
Save
</button>

<button onclick="loadData()">
Load
</button>

</div>

<svg id="viewer">

<g id="canvas"></g>

</svg>

<script>

let svg=document.getElementById("viewer");
let canvas=document.getElementById("canvas");

let scale=1;
let panX=0;
let panY=0;

let isDraggingCanvas=false;

let startX,startY;

let pathways=[];

function updateTransform(){

canvas.setAttribute(
"transform",
`translate(${panX},${panY}) scale(${scale})`
);

}

svg.addEventListener("wheel",(e)=>{

e.preventDefault();

if(e.deltaY<0){
scale*=1.1;
}
else{
scale*=0.9;
}

updateTransform();

});

svg.addEventListener("mousedown",(e)=>{

if(e.target.classList.contains("draggable")){

dragNodeData={
id:e.target.dataset.id
};

return;

}

isDraggingCanvas=true;

startX=e.clientX-panX;
startY=e.clientY-panY;

});

window.addEventListener("mouseup",()=>{

dragNodeData=null;
isDraggingCanvas=false;

});

svg.addEventListener("mousemove",(e)=>{

if(!isDraggingCanvas) return;

panX=e.clientX-startX;
panY=e.clientY-startY;

updateTransform();

});

function createLinear(){

let mol1=document.getElementById("mol1").value;
let enzyme=document.getElementById("enzyme").value;
let mol2=document.getElementById("mol2").value;

let reversible=confirm(
"Reversible reaction?"
);

let previous=pathways[pathways.length-1];

let x1=200;
let y1=200;

if(previous && previous.type==="linear"){

x1=previous.x2+300;
y1=previous.y2;

}

let x2=x1+400;
let y2=y1;

pathways.push({
id:Date.now()+Math.random(),
type:"linear",
mol1,
enzyme,
mol2,
reversible,
x1,
y1,
x2,
y2
});

render();

}

function render(){

canvas.innerHTML="";

pathways.forEach((p)=>{

canvas.innerHTML += `

${
p.reversible ?

`

<line
x1="${p.x1+90}"
y1="${p.y1-12}"
x2="${p.x2-90}"
y2="${p.y2-12}"
class="arrow"
/>

<polygon
points="
${p.x2-90},${p.y2-12}
${p.x2-120},${p.y2-27}
${p.x2-120},${p.y2+3}"
fill="white"
/>

<line
x1="${p.x2-90}"
y1="${p.y2+12}"
x2="${p.x1+90}"
y2="${p.y1+12}"
class="arrow"
/>

<polygon
points="
${p.x1+90},${p.y1+12}
${p.x1+120},${p.y1-3}
${p.x1+120},${p.y1+27}"
fill="white"
/>

`

:

`

<line
x1="${p.x1+90}"
y1="${p.y1}"
x2="${p.x2-90}"
y2="${p.y2}"
class="arrow"
/>

<polygon
points="
${p.x2-90},${p.y2}
${p.x2-120},${p.y2-15}
${p.x2-120},${p.y2+15}"
fill="white"
/>

`

}

<rect
x="${p.x1-90}"
y="${p.y1-45}"
width="180"
height="90"
rx="15"
fill="#00d4ff"
stroke="white"
stroke-width="2"
class="node draggable"
data-id="${p.id}"
/>

<text
x="${p.x1}"
y="${p.y1+5}"
class="label"
>
${p.mol1}
</text>

<rect
x="${p.x2-90}"
y="${p.y2-45}"
width="180"
height="90"
rx="15"
fill="#ff9800"
stroke="white"
stroke-width="2"
/>

<text
x="${p.x2}"
y="${p.y2+5}"
class="label"
>
${p.mol2}
</text>

<text
x="${(p.x1+p.x2)/2}"
y="${p.y1-60}"
class="enzyme"
>
${p.enzyme}
</text>

`;

});

updateTransform();

}

let dragNodeData=null;

window.addEventListener("mousemove",(e)=>{

if(!dragNodeData) return;

let node=pathways.find(
p=>p.id==dragNodeData.id
);

if(node){

node.x1=(e.clientX-panX)/scale;
node.y1=(e.clientY-panY)/scale;

render();

}

});

function saveData(){

localStorage.setItem(
"biochampData",
JSON.stringify(pathways)
);

alert("Saved");

}

function loadData(){

let data=localStorage.getItem("biochampData");

if(data){

pathways=JSON.parse(data);

render();

alert("Loaded");

}

}

updateTransform();

</script>

</body>
</html>
