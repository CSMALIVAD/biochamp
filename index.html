<!DOCTYPE html>
<html>

<head>

<title>BioChamp</title>

<style>

body{
margin:0;
background:black;
font-family:Arial;
overflow:hidden;
color:white;
}

#panel{
position:absolute;
top:20px;
left:20px;
z-index:10;
background:#111;
padding:20px;
border-radius:10px;
border:1px solid #333;
}

h2{
margin-top:0;
}

input{
display:block;
margin-top:10px;
padding:10px;
width:220px;
background:#222;
border:1px solid #444;
color:white;
}

button{
margin-top:12px;
padding:10px;
width:100%;
background:#00d4ff;
border:none;
font-weight:bold;
cursor:pointer;
}

svg{
width:100vw;
height:100vh;
cursor:grab;
}

.node{
stroke:white;
stroke-width:2;
cursor:pointer;
}

.label{
fill:white;
font-size:18px;
text-anchor:middle;
pointer-events:none;
}

.arrow{
stroke:white;
stroke-width:4;
fill:none;
}

.enzyme{
fill:#00ff88;
font-size:20px;
text-anchor:middle;
pointer-events:none;
}

</style>

</head>

<body>

<div id="panel">

<h2>BioChamp</h2>

<input id="mol1" placeholder="First Metabolite">

<input id="enzyme" placeholder="Enzyme">

<input id="mol2" placeholder="Second Metabolite">
<input id="coIn" placeholder="Cofactor Input">

<input id="coOut" placeholder="Cofactor Output">
<button onclick="createLinear()">
Create Linear
</button>

<button onclick="createCircular()">
Create Circular
</button>

<button onclick="saveData()">
Save
</button>

<button onclick="loadData()">
Load
</button>

</div>

<svg id="viewer">

<g id="canvas"></g>

</svg>

<script>

let svg=document.getElementById("viewer");
let canvas=document.getElementById("canvas");

let scale=1;
let panX=0;
let panY=0;

let isDraggingCanvas=false;

let startX,startY;

let pathways=[];

let dragData=null;

function updateTransform(){

canvas.setAttribute(
"transform",
`translate(${panX},${panY}) scale(${scale})`
);

}

svg.addEventListener("wheel",(e)=>{

e.preventDefault();

if(e.deltaY<0){
scale*=1.1;
}
else{
scale*=0.9;
}

updateTransform();

});

svg.addEventListener("mousedown",(e)=>{

if(e.target.dataset.type){

dragData={
type:e.target.dataset.type,
pathway:parseInt(e.target.dataset.pathway),
node:parseInt(e.target.dataset.node)
};

return;

}

isDraggingCanvas=true;

startX=e.clientX-panX;
startY=e.clientY-panY;

});

window.addEventListener("mouseup",()=>{

dragData=null;
isDraggingCanvas=false;

});

window.addEventListener("mousemove",(e)=>{

if(dragData){

let mouseX=(e.clientX-panX)/scale;
let mouseY=(e.clientY-panY)/scale;

let p=pathways[dragData.pathway];

if(dragData.type==="linear-left"){

p.x1=mouseX;
p.y1=mouseY;

}

if(dragData.type==="linear-right"){

p.x2=mouseX;
p.y2=mouseY;

}

if(dragData.type==="circle-node"){

p.nodes[dragData.node].x=mouseX;
p.nodes[dragData.node].y=mouseY;

}

render();

return;

}

if(!isDraggingCanvas) return;

panX=e.clientX-startX;
panY=e.clientY-startY;

updateTransform();

});

function createLinear(){

let mol1=document.getElementById("mol1").value;
let enzyme=document.getElementById("enzyme").value;
let mol2=document.getElementById("mol2").value;
let coIn=document.getElementById("coIn").value;
let coOut=document.getElementById("coOut").value;
pathways.push({
type:"linear",
mol1,
enzyme,
mol2,
coIn,
coOut,
x1:200,
y1:200+pathways.length*250,
x2:700,
y2:200+pathways.length*250
});

render();

}

function createCircular(){

let radius=250;
let centerX=900;
let centerY=500;

let mol1=document.getElementById("mol1").value;
let enzyme=document.getElementById("enzyme").value;
let mol2=document.getElementById("mol2").value;

let names=[
mol1,
mol2,
"Intermediate 1",
"Intermediate 2",
"Intermediate 3",
"Intermediate 4",
"Intermediate 5",
"Intermediate 6"
];

let nodes=[];

for(let i=0;i<8;i++){

let angle=(Math.PI*2/8)*i;

nodes.push({
x:centerX+Math.cos(angle)*radius,
y:centerY+Math.sin(angle)*radius,
name:names[i]
});

}

pathways.push({
type:"circular",
nodes:nodes
});

render();

}

function render(){

canvas.innerHTML="";

pathways.forEach((p,pIndex)=>{

if(p.type==="linear"){

canvas.innerHTML += `

<line
x1="${p.x1+90}"
y1="${p.y1}"
x2="${p.x2-90}"
y2="${p.y2}"
class="arrow"
/>

<polygon
points="
${p.x2-90},${p.y2}
${p.x2-120},${p.y2-15}
${p.x2-120},${p.y2+15}"
fill="white"
/>

<!-- LEFT NODE -->

<rect
x="${p.x1-90}"
y="${p.y1-45}"
width="180"
height="90"
rx="15"
fill="#00d4ff"
stroke="white"
stroke-width="2"
class="node"
data-type="linear-left"
data-pathway="${pIndex}"
/>

<text
x="${p.x1}"
y="${p.y1+5}"
class="label"
>
${p.mol1}
</text>

<!-- RIGHT NODE -->

<rect
x="${p.x2-90}"
y="${p.y2-45}"
width="180"
height="90"
rx="15"
fill="#ff9800"
stroke="white"
stroke-width="2"
class="node"
data-type="linear-right"
data-pathway="${pIndex}"
/>

<text
x="${p.x2}"
y="${p.y2+5}"
class="label"
>
${p.mol2}
</text>
<!-- ATP NODE -->

<rect
x="${((p.x1+p.x2)/2)-70}"
y="${p.y1-180}"
width="140"
height="60"
rx="12"
fill="#9c27b0"
stroke="white"
stroke-width="2"
/>

<text
x="${(p.x1+p.x2)/2}"
y="${p.y1-142}"
class="label"
>
${p.coIn || "ATP"}
</text>

<!-- ATP ARROW -->

<line
x1="${(p.x1+p.x2)/2}"
y1="${p.y1-120}"
x2="${(p.x1+p.x2)/2}"
y2="${p.y1-20}"
stroke="white"
stroke-width="3"
/>

<!-- ADP NODE -->

<rect
x="${((p.x1+p.x2)/2)-70}"
y="${p.y1+120}"
width="140"
height="60"
rx="12"
fill="#673ab7"
stroke="white"
stroke-width="2"
/>

<text
x="${(p.x1+p.x2)/2}"
y="${p.y1+158}"
class="label"
>
${p.coOut || "ADP"}
</text>

<!-- ADP ARROW -->

<line
x1="${(p.x1+p.x2)/2}"
y1="${p.y1+20}"
x2="${(p.x1+p.x2)/2}"
y2="${p.y1+120}"
stroke="white"
stroke-width="3"
/>
<!-- ENZYME -->

<text
x="${(p.x1+p.x2)/2}"
y="${p.y1-60}"
class="enzyme"
>
${p.enzyme}
</text>

`;

}

if(p.type==="circular"){

for(let i=0;i<p.nodes.length;i++){

let n1=p.nodes[i];
let n2=p.nodes[(i+1)%p.nodes.length];

canvas.innerHTML += `

<line
x1="${n1.x}"
y1="${n1.y}"
x2="${n2.x}"
y2="${n2.y}"
class="arrow"
/>
<text
x="${(n1.x+n2.x)/2}"
y="${(n1.y+n2.y)/2}"
class="enzyme"
>
${document.getElementById("enzyme").value}
</text>
<rect
x="${n1.x-60}"
y="${n1.y-35}"
width="120"
height="70"
rx="15"
fill="#00d4ff"
stroke="white"
stroke-width="2"
class="node"
data-type="circle-node"
data-pathway="${pIndex}"
data-node="${i}"
/>

<text
x="${n1.x}"
y="${n1.y+5}"
class="label"
>
${n1.name}
</text>

`;

}

}

});

updateTransform();

}

function saveData(){

localStorage.setItem(
"biochampData",
JSON.stringify(pathways)
);

alert("Saved");

}

function loadData(){

let data=localStorage.getItem("biochampData");

if(data){

pathways=JSON.parse(data);

render();

alert("Loaded");

}

}

updateTransform();

</script>

</body>
</html>
